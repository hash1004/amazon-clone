# Deploys to production on every push to main (a merged PR is a push to
# main). Pull requests run the check job only, so a broken change shows
# red before it's merged. Two jobs:
#   check  — lint, typecheck and a production build, with no database, the
#            same way the Docker build runs. A red check never deploys.
#   deploy — SSHes into the VPS and runs scripts/deploy.sh there (fetch
#            origin/main → release.sh: build images, sync schema, roll the
#            service), then the insert-only sample-review seed.
#
# Needs these repository secrets (Settings → Secrets and variables →
# Actions), and a `production` environment (Settings → Environments):
#   DEPLOY_HOST         VPS hostname or IP
#   DEPLOY_USER         SSH user (root today)
#   DEPLOY_SSH_KEY      private key for a deploy-only key pair; its public
#                       half goes in that user's ~/.ssh/authorized_keys
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan <host>`, so the runner can
#                       verify it's talking to the real VPS
# The VPS checkout's `origin` must be able to fetch this repo (a read-only
# deploy key if the repo is private).

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of
# cancelling it halfway through a schema sync.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma needs a URL to generate the client; nothing connects to it.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run build

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://stillcoffeeandco.svdistributor.com
    steps:
      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not deployed: missing repository secrets:$missing (see README, \"Automatic: every merge to main\")."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy on the VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /root/amazon-clone && ./scripts/deploy.sh && ./scripts/seed-reviews-prod.sh'

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://stillcoffeeandco.svdistributor.com/) || true
            [ "$code" = "200" ] && echo "Live: HTTP $code" && exit 0
            echo "Got HTTP $code, retrying in 10s"; sleep 10
          done
          echo "Site did not return 200 after deploy" >&2
          exit 1
